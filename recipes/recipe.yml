# recipes/recipe.yml
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: aurora-custom-rtx
description: Aurora Linux com NVIDIA RTX, Snap, Mullvad, Slack e TLS 1.0 Legacy.
base-image: ghcr.io/ublue-os/aurora-nvidia
image-version: stable

modules:
  - type: rpm-ostree
    repos:
      - https://repository.mullvad.net/rpm/stable/x86_64/mullvad.repo
    install:
      - mullvad-vpn
      - snapd
      - crypto-policies-scripts
      - fuse

  - type: default-flatpaks # Nome corrigido para o esquema v1
    system: true           # Obrigatório para imagens Aurora/Bluefin
    install:
      - io.dbeaver.DBeaverCommunity
      - com.slack.Slack

  - type: script
    scripts:
      - post-install.sh