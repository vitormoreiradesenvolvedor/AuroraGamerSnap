name: Build Aurora Custom
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-image:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 5120
          swap-size-mb: 1024
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: Build
        uses: blue-build/github-action@v1.8
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          maximize_build_space: false # Já limpamos acima
          generate_iso: true

  generate-iso:
    name: Generate ISO
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO
        uses: jasonn3/build-container-installer@v1.4.0 # Ação oficial correta
        id: build
        with:
          arch: x86_64
          image_name: aurora-custom-rtx
          image_repo: ghcr.io/${{ github.repository_owner }}
          image_tag: latest
          version: 43 # Versão base do Fedora para o Aurora em 2026
          variant: Aurora

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.iso_name }}
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-sha256sum
          retention-days: 5