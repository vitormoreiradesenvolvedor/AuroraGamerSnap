name: bluebuild
on:
  schedule:
    - cron: "00 17 * * *"
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

jobs:
  bluebuild:
    name: Build Custom Image
    uses: blue-build/github-action/.github/workflows/reusable-build.yml@v1
    with:
      recipe: recipe.yml
      pr_event_number: ${{ github.event.number }}
    secrets:
      cosign_private_key: ${{ secrets.SIGNING_SECRET }}
      registry_token: ${{ secrets.GITHUB_TOKEN }}